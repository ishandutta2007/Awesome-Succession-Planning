<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070b12" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="route-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="route-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="route-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="text-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="80%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <radialGradient id="radar-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="depot-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="glow-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- CSS Animations -->
    <style>
      .dash-route-1 {
        stroke-dasharray: 8 6;
        animation: flowRoute 25s linear infinite;
      }
      .dash-route-2 {
        stroke-dasharray: 6 5;
        animation: flowRouteReverse 20s linear infinite;
      }
      .dash-route-3 {
        stroke-dasharray: 7 6;
        animation: flowRoute 30s linear infinite;
      }
      .pulse-ring {
        transform-origin: center;
        animation: pulseWave 3s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      }
      .pulse-ring-delayed {
        transform-origin: center;
        animation: pulseWave 3s cubic-bezier(0.215, 0.61, 0.355, 1) infinite 1.5s;
      }
      .beacon-dot {
        animation: blinkBeacon 2s ease-in-out infinite;
      }
      .truck-marker {
        animation: floatMarker 4s ease-in-out infinite alternate;
      }
      @keyframes flowRoute {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes flowRouteReverse {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 200; }
      }
      @keyframes pulseWave {
        0% { r: 12px; opacity: 0.9; stroke-width: 2.5px; }
        100% { r: 75px; opacity: 0; stroke-width: 0.5px; }
      }
      @keyframes blinkBeacon {
        0%, 100% { opacity: 0.3; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      @keyframes floatMarker {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2" />

  <!-- Logistics Network Grid Pattern Overlay -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="100" y1="0" x2="100" y2="380" />
    <line x1="200" y1="0" x2="200" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="400" y1="0" x2="400" y2="380" />
    <line x1="500" y1="0" x2="500" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="700" y1="0" x2="700" y2="380" />
    <line x1="800" y1="0" x2="800" y2="380" />
    <line x1="900" y1="0" x2="900" y2="380" />
    <line x1="1000" y1="0" x2="1000" y2="380" />
    <line x1="1100" y1="0" x2="1100" y2="380" />
  </g>

  <!-- Right Visual Map & Graph Topology -->
  <g transform="translate(40, 0)">
    <!-- Depot Area Glow -->
    <circle cx="940" cy="180" r="130" fill="url(#radar-glow)" />

    <!-- Secondary Network Connections (Static faint) -->
    <g opacity="0.25" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3">
      <line x1="760" y1="110" x2="860" y2="80" />
      <line x1="860" y1="80" x2="980" y2="100" />
      <line x1="980" y1="100" x2="1080" y2="140" />
      <line x1="1080" y1="140" x2="1110" y2="240" />
      <line x1="1110" y1="240" x2="1020" y2="300" />
      <line x1="1020" y1="300" x2="880" y2="280" />
      <line x1="880" y1="280" x2="780" y2="220" />
      <line x1="780" y1="220" x2="760" y2="110" />
    </g>

    <!-- Optimized Route 1 (Cyan/Purple Delivery Loop) -->
    <path class="dash-route-1" d="M 940,180 L 860,80 L 760,110 L 780,220 L 880,280 Z" fill="none" stroke="url(#route-cyan)" stroke-width="3" filter="url(#glow-blur)" />
    <path class="dash-route-1" d="M 940,180 L 860,80 L 760,110 L 780,220 L 880,280 Z" fill="none" stroke="#e0f2fe" stroke-width="1.5" />

    <!-- Optimized Route 2 (Amber/Pink Fleet Route) -->
    <path class="dash-route-2" d="M 940,180 L 980,100 L 1080,140 L 1110,240 L 1020,300 Z" fill="none" stroke="url(#route-amber)" stroke-width="3" filter="url(#glow-blur)" />
    <path class="dash-route-2" d="M 940,180 L 980,100 L 1080,140 L 1110,240 L 1020,300 Z" fill="none" stroke="#ffedd5" stroke-width="1.5" />

    <!-- Central Depot Hub (Node 0) -->
    <circle cx="940" cy="180" r="16" fill="#0f172a" stroke="#f59e0b" stroke-width="3" />
    <circle cx="940" cy="180" r="6" fill="#f59e0b" />
    <circle class="pulse-ring" cx="940" cy="180" r="16" fill="none" stroke="#f59e0b" />
    <circle class="pulse-ring-delayed" cx="940" cy="180" r="16" fill="none" stroke="#38bdf8" />

    <!-- Waypoint Stop Nodes -->
    <!-- Stop 1 -->
    <circle cx="860" cy="80" r="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="860" cy="80" r="3.5" fill="#38bdf8" class="beacon-dot" />
    <text x="860" y="65" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Stop 01</text>

    <!-- Stop 2 -->
    <circle cx="760" cy="110" r="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="760" cy="110" r="3.5" fill="#38bdf8" class="beacon-dot" />
    <text x="735" y="105" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Stop 02</text>

    <!-- Stop 3 -->
    <circle cx="780" cy="220" r="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="780" cy="220" r="3.5" fill="#38bdf8" class="beacon-dot" />
    <text x="755" y="240" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Stop 03</text>

    <!-- Stop 4 -->
    <circle cx="880" cy="280" r="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="880" cy="280" r="3.5" fill="#38bdf8" class="beacon-dot" />
    <text x="880" y="305" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Stop 04</text>

    <!-- Stop 5 -->
    <circle cx="980" cy="100" r="8" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5" />
    <circle cx="980" cy="100" r="3.5" fill="#fbbf24" class="beacon-dot" />
    <text x="980" y="85" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Stop 05</text>

    <!-- Stop 6 -->
    <circle cx="1080" cy="140" r="8" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5" />
    <circle cx="1080" cy="140" r="3.5" fill="#fbbf24" class="beacon-dot" />
    <text x="1105" y="135" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Stop 06</text>

    <!-- Stop 7 -->
    <circle cx="1110" cy="240" r="8" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5" />
    <circle cx="1110" cy="240" r="3.5" fill="#fbbf24" class="beacon-dot" />
    <text x="1135" y="255" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Stop 07</text>

    <!-- Stop 8 -->
    <circle cx="1020" cy="300" r="8" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5" />
    <circle cx="1020" cy="300" r="3.5" fill="#fbbf24" class="beacon-dot" />
    <text x="1020" y="325" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Stop 08</text>

    <!-- Moving Vehicle Badge / Floating Indicator -->
    <g class="truck-marker" transform="translate(805, 90)">
      <rect width="64" height="24" rx="12" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" filter="url(#soft-shadow)" />
      <text x="32" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">🚚 Fleet A</text>
    </g>

    <g class="truck-marker" transform="translate(1040, 260)">
      <rect width="64" height="24" rx="12" fill="#b45309" stroke="#f59e0b" stroke-width="1.5" filter="url(#soft-shadow)" />
      <text x="32" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">⚡ Fleet B</text>
    </g>
  </g>

  <!-- Left Header & Branding Content -->
  <g transform="translate(70, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 60)">
      <rect width="270" height="30" rx="15" fill="#0f2942" stroke="#0284c7" stroke-width="1.2" />
      <circle cx="15" cy="15" r="5" fill="#38bdf8" class="beacon-dot" />
      <text x="30" y="20" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">LOGISTICS &amp; VRP SOLVERS</text>
    </g>

    <!-- Main Title with Glow -->
    <g transform="translate(0, 140)" filter="url(#soft-shadow)">
      <text x="0" y="0" fill="url(#text-shimmer)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">
        Awesome Route Optimization
      </text>
    </g>

    <!-- Subtitle / Tagline -->
    <g transform="translate(0, 180)">
      <text x="0" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
        Curated SaaS Platforms, VRP Engines, Fleet Dispatch &amp; Open-Source Routing Solvers
      </text>
    </g>

    <!-- Feature Highlights Tags -->
    <g transform="translate(0, 222)">
      <!-- Tag 1: VRP & CVRP -->
      <g transform="translate(0, 0)">
        <rect width="130" height="34" rx="8" fill="#0b213f" stroke="#1e3a5f" stroke-width="1" />
        <text x="14" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📍 VRP / CVRP</text>
      </g>

      <!-- Tag 2: Last-Mile Delivery -->
      <g transform="translate(140, 0)">
        <rect width="165" height="34" rx="8" fill="#0b213f" stroke="#1e3a5f" stroke-width="1" />
        <text x="14" y="21" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🚚 Last-Mile Dispatch</text>
      </g>

      <!-- Tag 3: Multi-Stop Routing -->
      <g transform="translate(315, 0)">
        <rect width="160" height="34" rx="8" fill="#0b213f" stroke="#1e3a5f" stroke-width="1" />
        <text x="14" y="21" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Multi-Depot Planning</text>
      </g>

      <!-- Tag 4: Open Engines -->
      <g transform="translate(485, 0)">
        <rect width="150" height="34" rx="8" fill="#0b213f" stroke="#1e3a5f" stroke-width="1" />
        <text x="14" y="21" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🛠️ Open Routing Stacks</text>
      </g>
    </g>

    <!-- Bottom Metric / Footer line -->
    <g transform="translate(0, 300)">
      <line x1="0" y1="0" x2="635" y2="0" stroke="#1e293b" stroke-width="1" />
      <text x="0" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
        Time Windows • Capacity Constraints • Distance Matrices • Real-Time Re-Optimization
      </text>
    </g>
  </g>
</svg>

