<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Card Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #f8fafc;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 18px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
        letter-spacing: 1px;
      }
      .stat-title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 16px;
        fill: #e2e8f0;
      }
      .stat-desc {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 12px;
        fill: #64748b;
      }

      /* Dynamic Animations */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -40; }
      }
      @keyframes barPulse {
        0%, 100% { height: 45px; y: 195px; }
        50% { height: 65px; y: 175px; }
      }
      @keyframes barPulse2 {
        0%, 100% { height: 75px; y: 165px; }
        50% { height: 55px; y: 185px; }
      }

      .floating-node { animation: floatSlow 6s ease-in-out infinite; transform-origin: center; }
      .glowing-orb { animation: pulseGlow 4s ease-in-out infinite; transform-origin: center; }
      .stream-line { stroke-dasharray: 6 6; animation: dashAnim 2s linear infinite; }
      .chart-bar-1 { animation: barPulse 3.5s ease-in-out infinite; }
      .chart-bar-2 { animation: barPulse2 4.2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>

  <!-- Decorative Grid & Circuit Lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="160" y1="0" x2="160" y2="320"/>
    <line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="480" y1="0" x2="480" y2="320"/>
    <line x1="640" y1="0" x2="640" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="960" y1="0" x2="960" y2="320"/>
    <line x1="1120" y1="0" x2="1120" y2="320"/>
  </g>

  <!-- Glowing Background Lights -->
  <circle cx="200" cy="100" r="140" fill="#38bdf8" opacity="0.08" class="glowing-orb" filter="url(#glow)"/>
  <circle cx="1020" cy="220" r="160" fill="#818cf8" opacity="0.1" class="glowing-orb" filter="url(#glow)"/>

  <!-- Left / Hero Graphic: Warehouse & Labor Optimization Node -->
  <g class="floating-node">
    <!-- Isometric Warehouse Hub Base -->
    <rect x="70" y="70" width="100" height="100" rx="20" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="85" y="85" width="70" height="70" rx="14" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="2"/>

    <!-- Forklift / Warehouse Icon Representation -->
    <path d="M102 128 L114 105 L128 105 L138 128 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="108" cy="132" r="5" fill="#38bdf8"/>
    <circle cx="132" cy="132" r="5" fill="#38bdf8"/>
    <path d="M128 105 L128 132 M138 114 L146 114 L146 132" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Interactive Data Streams Connecting Nodes -->
  <path d="M170 120 C 210 120, 210 70, 250 70" fill="none" stroke="#38bdf8" stroke-width="2" class="stream-line" opacity="0.5"/>
  <path d="M170 120 C 210 120, 210 170, 250 170" fill="none" stroke="#818cf8" stroke-width="2" class="stream-line" opacity="0.5"/>

  <!-- Top Category Pill -->
  <rect x="250" y="52" width="280" height="28" rx="14" fill="#0c4a6e" fill-opacity="0.6" stroke="#0284c7" stroke-width="1"/>
  <text x="262" y="71" class="badge-text">⚡ LABOR MANAGEMENT &amp; LMS ECOSYSTEM</text>

  <!-- Main Headline Title -->
  <text x="250" y="122" class="title-text">Awesome Warehouse Labor Optimization</text>

  <!-- Subtitle -->
  <text x="250" y="156" class="subtitle-text">Curated SaaS Platforms, Engineered Labor Standards, Open WMS &amp; Workforce Analytics</text>

  <!-- Feature Tags / Capabilities Row -->
  <g transform="translate(250, 195)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="135" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="14" y="22" class="stat-title">⏱️ ELS Standards</text>

    <!-- Tag 2 -->
    <rect x="147" y="0" width="155" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="160" y="22" class="stat-title">📊 Task Interleaving</text>

    <!-- Tag 3 -->
    <rect x="314" y="0" width="155" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="327" y="22" class="stat-title">🤖 Workforce AI</text>

    <!-- Tag 4 -->
    <rect x="481" y="0" width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="494" y="22" class="stat-title">📦 Open-Source WMS</text>
  </g>

  <!-- Right Visual: Animated Performance Chart & Efficiency Meter -->
  <g transform="translate(930, 45)" class="floating-node">
    <!-- Dashboard Card Background -->
    <rect x="0" y="0" width="200" height="225" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <rect x="15" y="15" width="170" height="30" rx="6" fill="#1e293b"/>
    <text x="26" y="35" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#38bdf8">LABOR PRODUCTIVITY</text>
    <circle cx="168" cy="30" r="4" fill="#10b981"/>

    <!-- Chart Bars (Dynamic Animated) -->
    <rect x="25" y="185" width="18" height="55" rx="4" fill="#334155"/>
    <rect x="52" y="165" width="18" height="75" rx="4" fill="#0284c7" class="chart-bar-2"/>
    <rect x="79" y="195" width="18" height="45" rx="4" fill="#38bdf8" class="chart-bar-1"/>
    <rect x="106" y="145" width="18" height="95" rx="4" fill="#818cf8"/>
    <rect x="133" y="125" width="18" height="115" rx="4" fill="url(#accentGrad)"/>
    <rect x="160" y="110" width="18" height="130" rx="4" fill="#c084fc"/>

    <!-- Trend Line over Bars -->
    <path d="M34 180 Q 70 170, 95 150 T 142 120 T 169 105" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="169" cy="105" r="4" fill="#ffffff" stroke="#38bdf8" stroke-width="2"/>

    <!-- Efficiency Metric Box -->
    <rect x="15" y="55" width="170" height="42" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
    <text x="25" y="74" font-family="system-ui, sans-serif" font-weight="700" font-size="15" fill="#a5b4fc">+28.4%</text>
    <text x="25" y="88" font-family="system-ui, sans-serif" font-weight="500" font-size="10" fill="#818cf8">Throughput Efficiency</text>
    <text x="135" y="80" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#34d399">ACTIVE</text>
  </g>

  <!-- Bottom Accent Border Line -->
  <rect x="0" y="315" width="1200" height="5" fill="url(#accentGrad)"/>
</svg>
