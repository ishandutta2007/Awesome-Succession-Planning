<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e1b4b;#0f172a" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#1e293b">
        <animate attributeName="stop-color" values="#1e293b;#311b92;#1e293b" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="350" fill="url(#bg)" rx="16" />

  <!-- Animated network connection lines -->
  <g opacity="0.25">
    <line x1="150" y1="280" x2="350" y2="180" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="3s" repeatCount="indefinite" />
    </line>
    <line x1="350" y1="180" x2="600" y2="100" stroke="#818cf8" stroke-width="2" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="4s" repeatCount="indefinite" />
    </line>
    <line x1="600" y1="100" x2="850" y2="180" stroke="#818cf8" stroke-width="2" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="3.5s" repeatCount="indefinite" />
    </line>
    <line x1="850" y1="180" x2="1050" y2="280" stroke="#c084fc" stroke-width="2" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="3s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Glowing Nodes -->
  <g id="nodes">
    <circle cx="600" cy="100" r="14" fill="#818cf8" filter="url(#glow)">
      <animate attributeName="r" values="12;16;12" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="350" cy="180" r="10" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="r" values="9;12;9" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="850" cy="180" r="10" fill="#c084fc" filter="url(#glow)">
      <animate attributeName="r" values="9;12;9" dur="2.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Title & Subtitle -->
  <text x="600" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="url(#accent)" letter-spacing="2">
    AWESOME SUCCESSION PLANNING
  </text>
  <text x="600" y="255" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" letter-spacing="1">
    A Curated List of Leadership Pipeline, 9-Box Grid &amp; Talent Management Platforms
  </text>

  <!-- Animated Crown/Leadership Icon at top center -->
  <g transform="translate(580, 45)">
    <path d="M 5 35 L 0 10 L 12 20 L 20 0 L 28 20 L 40 10 L 35 35 Z" fill="url(#accent)" opacity="0.9">
      <animate attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="2s" repeatCount="indefinite" />
    </path>
  </g>
</svg>
