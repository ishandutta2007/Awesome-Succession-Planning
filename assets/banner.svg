<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="200" rx="20" fill="url(#bg-grad)" />
  <circle cx="100" cy="100" r="40" fill="#ffffff" opacity="0.1">
    <animate attributeName="r" values="40;60;40" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="700" cy="100" r="60" fill="#ffffff" opacity="0.1">
    <animate attributeName="r" values="60;80;60" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="400" cy="40" r="20" fill="#ffffff" opacity="0.1">
    <animate attributeName="r" values="20;30;20" dur="3s" repeatCount="indefinite" />
  </circle>
  <text x="400" y="90" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#glow)">
    Awesome Workplace Reservation
  </text>
  <text x="400" y="130" font-family="Arial, sans-serif" font-size="20" fill="#E0E7FF" text-anchor="middle">
    Top Platforms &amp; Open Source Projects
  </text>
</svg>
