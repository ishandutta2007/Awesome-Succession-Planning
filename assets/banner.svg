<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgb(2,0,36);stop-opacity:1" />
      <stop offset="50%" style="stop-color:rgb(9,9,121);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgb(0,212,255);stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="url(#grad1)"/>
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="white" font-weight="bold">Awesome Time Clock Software</text>
  <circle cx="100" cy="100" r="20" fill="white">
    <animate attributeName="r" values="20;30;20" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="700" cy="100" r="20" fill="white">
    <animate attributeName="r" values="20;30;20" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>