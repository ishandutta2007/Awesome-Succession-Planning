<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d19" />
      <stop offset="50%" stop-color="#0c192e" />
      <stop offset="100%" stop-color="#081021" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="radar-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0369a1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="text-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- Filters -->
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Styles & Keyframe Animations -->
    <style>
      .radar-sweep {
        transform-origin: 960px 190px;
        animation: rotateSweep 10s linear infinite;
      }
      .pulse-circle {
        transform-origin: 960px 190px;
        animation: pulseRing 4s ease-out infinite;
      }
      .pulse-circle-2 {
        transform-origin: 960px 190px;
        animation: pulseRing 4s ease-out infinite 2s;
      }
      .float-cloud {
        animation: floatSlow 6s ease-in-out infinite alternate;
      }
      .wave-line {
        stroke-dasharray: 8 4;
        animation: dashMove 20s linear infinite;
      }
      .glowing-dot {
        animation: blink 2.5s ease-in-out infinite;
      }
      @keyframes rotateSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulseRing {
        0% { r: 20px; opacity: 0.8; stroke-width: 2px; }
        100% { r: 140px; opacity: 0; stroke-width: 0.5px; }
      }
      @keyframes floatSlow {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -200; }
      }
      @keyframes blink {
        0%, 100% { opacity: 0.3; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.15); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="100" y1="0" x2="100" y2="380" />
    <line x1="200" y1="0" x2="200" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="400" y1="0" x2="400" y2="380" />
    <line x1="500" y1="0" x2="500" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="700" y1="0" x2="700" y2="380" />
    <line x1="800" y1="0" x2="800" y2="380" />
    <line x1="900" y1="0" x2="900" y2="380" />
    <line x1="1000" y1="0" x2="1000" y2="380" />
    <line x1="1100" y1="0" x2="1100" y2="380" />
  </g>

  <!-- Weather Isobar Contours -->
  <g opacity="0.2" fill="none" stroke="#0ea5e9" stroke-width="1.5">
    <path class="wave-line" d="M -50,120 Q 200,60 450,140 T 950,100 T 1250,150" />
    <path class="wave-line" d="M -50,220 Q 250,180 550,250 T 1000,200 T 1250,240" stroke="#38bdf8" />
    <path class="wave-line" d="M -50,300 Q 180,240 500,310 T 900,280 T 1250,320" stroke="#0284c7" />
  </g>

  <!-- Dynamic Doppler Radar Display on Right Side -->
  <g transform="translate(0, 0)">
    <circle cx="960" cy="190" r="140" fill="url(#radar-glow)" />
    <circle cx="960" cy="190" r="140" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.4" />
    <circle cx="960" cy="190" r="100" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.3" />
    <circle cx="960" cy="190" r="60" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4" />
    <circle cx="960" cy="190" r="20" fill="none" stroke="#7dd3fc" stroke-width="1" opacity="0.5" />

    <!-- Pulse Rings -->
    <circle class="pulse-circle" cx="960" cy="190" r="20" fill="none" stroke="#38bdf8" />
    <circle class="pulse-circle-2" cx="960" cy="190" r="20" fill="none" stroke="#0ea5e9" />

    <!-- Crosshairs -->
    <line x1="820" y1="190" x2="1100" y2="190" stroke="#0284c7" stroke-width="1" opacity="0.4" stroke-dasharray="4 4" />
    <line x1="960" y1="50" x2="960" y2="330" stroke="#0284c7" stroke-width="1" opacity="0.4" stroke-dasharray="4 4" />

    <!-- Rotating Radar Sweep Cone -->
    <g class="radar-sweep">
      <path d="M 960 190 L 1100 190 A 140 140 0 0 0 1060 90 Z" fill="url(#glow-grad)" opacity="0.5" />
      <line x1="960" y1="190" x2="1100" y2="190" stroke="#7dd3fc" stroke-width="2" />
    </g>

    <!-- Weather Echo Clusters / Radar Returns -->
    <path d="M 990 140 Q 1020 120 1040 150 Q 1030 170 1000 160 Z" fill="#22c55e" opacity="0.4" filter="url(#blur-glow)" />
    <path d="M 920 220 Q 940 195 970 215 Q 950 245 915 235 Z" fill="#eab308" opacity="0.4" filter="url(#blur-glow)" />
    <path d="M 935 225 Q 945 210 960 220 Z" fill="#ef4444" opacity="0.5" filter="url(#blur-glow)" />

    <!-- Satellite / Station Nodes -->
    <circle cx="910" cy="130" r="3.5" fill="#38bdf8" class="glowing-dot" />
    <circle cx="1020" cy="230" r="3.5" fill="#34d399" class="glowing-dot" />
    <circle cx="890" cy="250" r="3" fill="#fbbf24" class="glowing-dot" />
    <circle cx="1030" cy="120" r="3" fill="#60a5fa" class="glowing-dot" />
  </g>

  <!-- Left / Center Branding Content -->
  <g transform="translate(80, 0)">
    <!-- Weather Intelligence Badge -->
    <g transform="translate(0, 65)">
      <rect width="210" height="28" rx="14" fill="#0f2847" stroke="#0284c7" stroke-width="1" />
      <circle cx="14" cy="14" r="5" fill="#38bdf8" class="glowing-dot" />
      <text x="28" y="18" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1">METEOROLOGY &amp; AI</text>
    </g>

    <!-- Main Title with Glow -->
    <g transform="translate(0, 145)" filter="url(#soft-shadow)">
      <text x="0" y="0" fill="url(#text-shimmer)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
        Awesome Weather Intelligence
      </text>
    </g>

    <!-- Subtitle / Tagline -->
    <g transform="translate(0, 185)">
      <text x="0" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="400">
        Curated SaaS Platforms, AI Forecasting Models, Open APIs &amp; Climate Datasets
      </text>
    </g>

    <!-- Feature Highlights Tags -->
    <g transform="translate(0, 230)">
      <!-- Tag 1: Hyperlocal APIs -->
      <g transform="translate(0, 0)">
        <rect width="145" height="34" rx="8" fill="#0b213f" stroke="#1e3a5f" stroke-width="1" />
        <text x="14" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Hyperlocal APIs</text>
      </g>

      <!-- Tag 2: AI Weather Models -->
      <g transform="translate(155, 0)">
        <rect width="165" height="34" rx="8" fill="#0b213f" stroke="#1e3a5f" stroke-width="1" />
        <text x="14" y="21" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🧠 AI Weather Models</text>
      </g>

      <!-- Tag 3: Doppler & Radar -->
      <g transform="translate(330, 0)">
        <rect width="155" height="34" rx="8" fill="#0b213f" stroke="#1e3a5f" stroke-width="1" />
        <text x="14" y="21" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📡 Doppler &amp; Radar</text>
      </g>

      <!-- Tag 4: Climate Reanalysis -->
      <g transform="translate(495, 0)">
        <rect width="165" height="34" rx="8" fill="#0b213f" stroke="#1e3a5f" stroke-width="1" />
        <text x="14" y="21" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🌍 Global Reanalysis</text>
      </g>
    </g>

    <!-- Bottom Metric / Footer line -->
    <g transform="translate(0, 305)">
      <line x1="0" y1="0" x2="660" y2="0" stroke="#1e293b" stroke-width="1" />
      <text x="0" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
        Real-time Observations • 1940+ Archives • NWP Downscaling • Open Source Stacks
      </text>
    </g>
  </g>
</svg>
